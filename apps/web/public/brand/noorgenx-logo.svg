<svg viewBox="0 0 320 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldHex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="starCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- 3D Chamfered Hexagon Base -->
  <polygon
    points="40,6 74,24 74,62 40,80 6,62 6,24"
    fill="url(#goldHex)"
    stroke="#B45309"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Center Spark / Star -->
  <path
    d="M 40 18 Q 40 43 15 43 Q 40 43 40 68 Q 40 43 65 43 Q 40 43 40 18 Z"
    fill="url(#starCyan)"
  />

  <!-- Crisp Typography -->
  <text x="88" y="52" font-family="Arial, sans-serif" font-weight="900" font-size="38" letter-spacing="-1">
    <tspan fill="#0284C7">Noor</tspan><tspan fill="#0091FF">Gen</tspan><tspan fill="#38BDF8">X</tspan>
  </text>
  <text x="288" y="30" font-family="Arial, sans-serif" font-weight="700" font-size="14" fill="#38BDF8">TM</text>
</svg>